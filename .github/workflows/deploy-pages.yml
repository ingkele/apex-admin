# GitHub Pages 线上预览部署
# 推送 main 即自动构建并发布到 https://ingkele.github.io/apex-admin/
# 子路径部署依赖：VITE_BASE=/apex-admin/（资源前缀）+ router basepath（运行时路由）
# + dist/404.html SPA fallback（GitHub Pages 对未知路径回退 404.html 实现前端路由）
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建（子路径 /apex-admin/）
        run: pnpm build
        env:
          VITE_BASE: /apex-admin/

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
